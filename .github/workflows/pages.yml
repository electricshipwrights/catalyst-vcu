# Publishes the bench to GitHub Pages on every push to main: the Slint display
# built to WebAssembly, then the static bench, which runs the sims in the page
# (ui/README.md, Static hosting). Needs Settings → Pages → Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push replaces a queued one
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
      # Must match wasm-bindgen in app/Cargo.lock
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml

      # The Rust port against the prototype's fixtures (app/README.md, Tests)
      - name: Test
        working-directory: app
        run: cargo test -p vcu-core

      - name: Build
        working-directory: ui
        run: |
          pnpm install --frozen-lockfile
          pnpm build:wasm
          pnpm build:static

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ui/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
