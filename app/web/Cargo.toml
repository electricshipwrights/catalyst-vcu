[package]
name = "vcu-web"
description = "The VCU display in the browser: the device's software renderer on a canvas, fed by the bench's /bus WebSocket"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
vcu-display = { path = "../display" }
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = [
  "CanvasRenderingContext2d",
  "DomRect",
  "Element",
  "HtmlCanvasElement",
  "ImageData",
  "Location",
  "MessageEvent",
  "Performance",
  "PointerEvent",
  "Storage",
  "WebSocket",
  "Window",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
